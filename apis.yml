name: Wallet Studio
description: >-
  Wallet Studio, built by Miss Moneypenny Technologies GmbH, is a no-code SaaS
  platform for creating, deploying, and managing Apple Wallet and Google Wallet
  passes. Aimed primarily at insurance carriers, it turns policy administration,
  claims, and CRM systems into wallet-based customer engagement channels reaching
  the four billion people who already carry a digital wallet, without replacing
  existing backend infrastructure. The platform offers visual pass editors with
  one-click publishing, prebuilt insurance templates, integrated automation, a
  REST API and webhooks for connecting to third-party systems, and authenticated
  links to portals and value-added services. Hosting is GDPR-compliant and the
  company describes the platform as certified for enterprise security standards.
  Backed by Earlybird, the company raised roughly EUR 7 million in 2025. There is
  no public developer portal, API reference, or OpenAPI specification; the REST
  API is provisioned per customer.
